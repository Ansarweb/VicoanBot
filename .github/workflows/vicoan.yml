name: VicoanBot

on:
  workflow_dispatch:

concurrency:
  group: vicoan-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            git \
            cmake \
            g++ \
            make \
            gperf \
            libssl-dev \
            zlib1g-dev \
            curl

      - name: Build Telegram Local Bot API
        run: |
          git clone --recursive https://github.com/tdlib/telegram-bot-api.git

          cd telegram-bot-api

          mkdir build
          cd build

          cmake -DCMAKE_BUILD_TYPE=Release ..

          cmake --build . --target telegram-bot-api -j2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Local Bot API
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          echo "Starting Local Bot API..."

          ./telegram-bot-api/build/telegram-bot-api \
            --api-id="$TELEGRAM_API_ID" \
            --api-hash="$TELEGRAM_API_HASH" \
            --local \
            --http-port=8081 \
            > telegram-api.log 2>&1 &

          API_PID=$!

          echo "Local Bot API PID: $API_PID"

          echo "Waiting for Local Bot API..."

          for i in {1..30}; do
            if curl -s \
              "http://127.0.0.1:8081/bot${BOT_TOKEN}/getMe" \
              > /tmp/getme.json; then

              echo "Local Bot API is ready."
              cat /tmp/getme.json
              break
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "Local Bot API process stopped unexpectedly."
              echo "===== telegram-api.log ====="
              cat telegram-api.log
              exit 1
            fi

            echo "Waiting... ($i/30)"
            sleep 2
          done

          if ! curl -sf \
            "http://127.0.0.1:8081/bot${BOT_TOKEN}/getMe" \
            > /tmp/getme.json; then

            echo "Local Bot API did not become ready."

            echo "===== telegram-api.log ====="
            cat telegram-api.log

            exit 1
          fi

          echo
          echo "Removing webhook..."

          curl --fail-with-body \
            -X POST \
            "http://127.0.0.1:8081/bot${BOT_TOKEN}/deleteWebhook"

          echo
          echo "Local Bot API is ready."

      - name: Run VicoanBot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          echo "Starting VicoanBot on Local Bot API..."

          python -u bot.py

      - name: Show Local Bot API log
        if: always()
        run: |
          echo "===== telegram-api.log ====="

          if [ -f telegram-api.log ]; then
            cat telegram-api.log
          else
            echo "telegram-api.log not found."
          fi
