name: VicoanBot

on:
  workflow_dispatch:

concurrency:
  group: vicoan-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg \
            git \
            cmake \
            g++ \
            make \
            gperf \
            libssl-dev \
            zlib1g-dev \
            curl

      - name: Build Telegram Local Bot API
        run: |
          git clone --recursive https://github.com/tdlib/telegram-bot-api.git
          cd telegram-bot-api
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          cmake --build . --target telegram-bot-api -j2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Start Local Bot API
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          echo "Starting Local Bot API..."

          ./telegram-bot-api/build/telegram-bot-api \
            --api-id="$TELEGRAM_API_ID" \
            --api-hash="$TELEGRAM_API_HASH" \
            --local \
            --http-port=8081 \
            > telegram-api.log 2>&1 &

          sleep 15

          echo "Testing Local Bot API..."

          curl --fail-with-body \
            "http://127.0.0.1:8081/bot${{ secrets.BOT_TOKEN }}/getMe"

          echo

          echo "Removing any webhook..."

          curl --fail-with-body \
            -X POST \
            "http://127.0.0.1:8081/bot${{ secrets.BOT_TOKEN }}/deleteWebhook"

          echo

      - name: Run VicoanBot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          echo "Starting VicoanBot on Local Bot API..."
          python bot.py
